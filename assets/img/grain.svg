<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Film grain plate. feTurbulence is generated by the browser, so this is
       a ~400 byte file doing the work of a large noise texture. Kept low
       contrast: grain should be felt, not seen. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.5" intercept="0.25"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#g)" opacity="0.5"/>
</svg>
