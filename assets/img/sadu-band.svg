<svg xmlns="http://www.w3.org/2000/svg" width="168" height="132" viewBox="0 0 168 132">
  <!-- Al-Sadu band, redrawn stripe-for-stripe from the house's own textile:
       media/photos/sadu-textile.jpeg (1383x1025), the same cloth the owner
       sent through.

       This replaces an earlier version that was invented rather than traced,
       and that deliberately desaturated the red and orange on the theory that
       real sadu colour "reads as noise" at band size. That was wrong twice
       over: the saturated red/white/orange bead rows ARE the pattern's
       signature, and the owner recognised instantly that it was not his.
       Palette is now sampled from the cloth.

       Stripe order, mirrored about the centre line, as it runs along the band:
         black rail / red beads / white beads / orange beads / black rail
         camel twill ground
         black rail / orange sawtooth / black rail
         pale panel carrying the black comb-and-diamond motif

       Tiles seamlessly on x at 168px: every motif repeat is 84px and the
       bead rows are on a 12px pitch, so 168 closes both cleanly. -->
  <defs>
    <!-- the comb: a solid bar with tapering teeth hanging off it -->
    <g id="comb">
      <rect x="0" y="0" width="60" height="5" fill="#17140F"/>
      <path d="M2 5 L8 5 L6 20 Z"   fill="#17140F"/>
      <path d="M13 5 L19 5 L17 22 Z" fill="#17140F"/>
      <path d="M24 5 L30 5 L28 24 Z" fill="#17140F"/>
      <path d="M35 5 L41 5 L39 22 Z" fill="#17140F"/>
      <path d="M46 5 L52 5 L50 20 Z" fill="#17140F"/>
    </g>
    <!-- the diamond that sits between two combs -->
    <g id="lozenge">
      <path d="M12 2 L23 13 L12 24 L1 13 Z" fill="#17140F"/>
      <path d="M12 8 L17 13 L12 18 L7 13 Z" fill="#C9CBC6"/>
    </g>
    <!-- bead rows: short blocks on a 12px pitch, the way the weave reads -->
    <g id="beads">
      <rect x="0" y="0" width="8"  height="5" fill="#C8161A"/>
      <rect x="0" y="5" width="8"  height="5" fill="#F2EFE9"/>
      <rect x="0" y="10" width="8" height="5" fill="#E8810E"/>
    </g>
    <g id="tooth">
      <path d="M0 5 L4 0 L8 5 Z" fill="#E8810E"/>
    </g>
  </defs>

  <!-- camel twill ground -->
  <rect width="168" height="132" fill="#B09372"/>

  <!-- ===================== top half ===================== -->
  <rect y="0"  width="168" height="4" fill="#17140F"/>
  <g>                                  <!-- bead rows, 12px pitch -->
    <use href="#beads" x="0"  y="4"/><use href="#beads" x="12" y="4"/>
    <use href="#beads" x="24" y="4"/><use href="#beads" x="36" y="4"/>
    <use href="#beads" x="48" y="4"/><use href="#beads" x="60" y="4"/>
    <use href="#beads" x="72" y="4"/><use href="#beads" x="84" y="4"/>
    <use href="#beads" x="96" y="4"/><use href="#beads" x="108" y="4"/>
    <use href="#beads" x="120" y="4"/><use href="#beads" x="132" y="4"/>
    <use href="#beads" x="144" y="4"/><use href="#beads" x="156" y="4"/>
  </g>
  <rect y="19" width="168" height="4" fill="#17140F"/>

  <!-- camel ground shows through here (y 23-37) -->

  <rect y="37" width="168" height="3" fill="#17140F"/>
  <g>
    <use href="#tooth" x="0"  y="40"/><use href="#tooth" x="8"  y="40"/>
    <use href="#tooth" x="16" y="40"/><use href="#tooth" x="24" y="40"/>
    <use href="#tooth" x="32" y="40"/><use href="#tooth" x="40" y="40"/>
    <use href="#tooth" x="48" y="40"/><use href="#tooth" x="56" y="40"/>
    <use href="#tooth" x="64" y="40"/><use href="#tooth" x="72" y="40"/>
    <use href="#tooth" x="80" y="40"/><use href="#tooth" x="88" y="40"/>
    <use href="#tooth" x="96" y="40"/><use href="#tooth" x="104" y="40"/>
    <use href="#tooth" x="112" y="40"/><use href="#tooth" x="120" y="40"/>
    <use href="#tooth" x="128" y="40"/><use href="#tooth" x="136" y="40"/>
    <use href="#tooth" x="144" y="40"/><use href="#tooth" x="152" y="40"/>
    <use href="#tooth" x="160" y="40"/>
  </g>
  <rect y="45" width="168" height="3" fill="#17140F"/>

  <!-- ================= centre motif panel ================= -->
  <rect y="48" width="168" height="36" fill="#C9CBC6"/>
  <g>
    <use href="#comb"     x="6"  y="52"/>
    <use href="#lozenge"  x="68" y="54"/>
    <use href="#comb"     x="90" y="52"/>
    <use href="#lozenge"  x="152" y="54"/>
  </g>

  <!-- ===================== bottom half ===================== -->
  <rect y="84" width="168" height="3" fill="#17140F"/>
  <g transform="translate(0,181) scale(1,-1)">
    <use href="#tooth" x="0"  y="89"/><use href="#tooth" x="8"  y="89"/>
    <use href="#tooth" x="16" y="89"/><use href="#tooth" x="24" y="89"/>
    <use href="#tooth" x="32" y="89"/><use href="#tooth" x="40" y="89"/>
    <use href="#tooth" x="48" y="89"/><use href="#tooth" x="56" y="89"/>
    <use href="#tooth" x="64" y="89"/><use href="#tooth" x="72" y="89"/>
    <use href="#tooth" x="80" y="89"/><use href="#tooth" x="88" y="89"/>
    <use href="#tooth" x="96" y="89"/><use href="#tooth" x="104" y="89"/>
    <use href="#tooth" x="112" y="89"/><use href="#tooth" x="120" y="89"/>
    <use href="#tooth" x="128" y="89"/><use href="#tooth" x="136" y="89"/>
    <use href="#tooth" x="144" y="89"/><use href="#tooth" x="152" y="89"/>
    <use href="#tooth" x="160" y="89"/>
  </g>
  <rect y="92" width="168" height="3" fill="#17140F"/>

  <!-- camel ground shows through here (y 95-109) -->

  <rect y="109" width="168" height="4" fill="#17140F"/>
  <g transform="translate(0,241) scale(1,-1)">
    <use href="#beads" x="0"  y="113"/><use href="#beads" x="12" y="113"/>
    <use href="#beads" x="24" y="113"/><use href="#beads" x="36" y="113"/>
    <use href="#beads" x="48" y="113"/><use href="#beads" x="60" y="113"/>
    <use href="#beads" x="72" y="113"/><use href="#beads" x="84" y="113"/>
    <use href="#beads" x="96" y="113"/><use href="#beads" x="108" y="113"/>
    <use href="#beads" x="120" y="113"/><use href="#beads" x="132" y="113"/>
    <use href="#beads" x="144" y="113"/><use href="#beads" x="156" y="113"/>
  </g>
  <rect y="128" width="168" height="4" fill="#17140F"/>
</svg>
